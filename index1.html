<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase Popup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="display-6 fw-bold">Your landing page goes here</h1>
    <p class="lead text-secondary">Recent-purchase popups appear in the bottom-left corner.</p>
    <div class="d-flex gap-2 flex-wrap">
      <button id="toggleBtn" class="btn btn-dark">Pause popups</button>
      <button id="nowBtn" class="btn btn-outline-dark">Show one now</button>
    </div>
  </main>

  <div id="popupHost" class="popup-host" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app1.js"></script>
</body>


<footer class="site-footer">
  <p>Created by Lona Smith in the Republic of South Africa</p>
</footer>

<style>
  .site-footer {
    text-align: center;
    padding: 1.25rem 1rem;
    background: #111;
    color: #ddd;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    border-top: 1px solid #333;
  }
</style>
</html>
